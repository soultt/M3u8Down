<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; media-src 'self' seg: blob:; script-src 'self'; style-src 'self' 'unsafe-inline';">
<title>播放</title>
<style>
  html,body { margin:0; height:100%; background:#000; color:#eee; font-family:"Microsoft YaHei",sans-serif; }
  body { display:flex; flex-direction:column; }
  .pbar {
    height:34px; background:#111827; display:flex; align-items:center;
    -webkit-app-region:drag; flex-shrink:0; padding:0 6px 0 12px;
  }
  .pbar .t { flex:1; font-size:12px; color:#e5e7eb; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .pbtns { -webkit-app-region:no-drag; display:flex; }
  .pbtn { width:46px; height:34px; border:none; background:transparent; color:#e5e7eb; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:background .12s,color .12s; }
  .pbtn:hover { background:#374151; color:#fff; }
  .pbtn:active { background:#4b5563; }
  .pbtn.c:hover { background:#e11d48; color:#fff; }
  .pbtn.c:active { background:#be123c; }
  #stage { flex:1; display:flex; flex-direction:column; min-height:0; }
  video { flex:1; width:100%; background:#000; }
  #bar { padding:8px 12px; background:#111827; font-size:12px; display:flex; gap:12px; align-items:center; }
  #tip { color:#9ca3af; }
  #status { color:#60a5fa; }
  .rbtn {
    border:1px solid #374151; background:#1f2937; color:#e5e7eb;
    border-radius:5px; padding:3px 10px; font-size:12px; cursor:pointer;
  }
  .rbtn:hover { background:#374151; }
  .rbtn:disabled { opacity:.5; cursor:not-allowed; }
</style>
</head>
<body>
<div class="pbar">
  <span class="t" id="ptitle">播放</span>
  <div class="pbtns">
    <button class="pbtn" id="pmin" title="隐藏（最小化当前播放窗口）">
      <svg width="14" height="14" viewBox="0 0 12 12"><rect x="2" y="5" width="8" height="2" rx="0.5" fill="currentColor"/></svg>
    </button>
    <button class="pbtn" id="pfull" title="全屏">
      <svg width="14" height="14" viewBox="0 0 12 12">
        <path d="M1.5 4V1.5H4 M8 1.5h2.5V4 M10.5 8v2.5H8 M4 10.5H1.5V8" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <button class="pbtn c" id="pclose" title="关闭">
      <svg width="14" height="14" viewBox="0 0 12 12"><path d="M2.5 2.5 L9.5 9.5 M9.5 2.5 L2.5 9.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
    </button>
  </div>
</div>
<div id="stage">
  <video id="v" controls autoplay playsinline></video>
  <div id="bar">
    <button id="refresh" class="rbtn" style="display:none;">刷新到最新进度</button>
    <button id="fullscreen" class="rbtn">全屏</button>
    <span id="status">正在加载…</span>
    <span id="tip"></span>
  </div>
</div>
<script src="player.js"></script>
</body>
</html>
